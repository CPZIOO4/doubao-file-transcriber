name: Windows build and offline tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable app and test without Doubao
        shell: pwsh
        run: ./scripts/build.ps1 -SkipInstaller
